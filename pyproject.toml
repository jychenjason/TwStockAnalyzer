[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tw-stock-analyzer"
version = "0.1.0"
description = "Taiwan Stock Analyzer - CLI and web application for TW stock analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.0",
    "pandas-ta>=0.3.16b0",
    "plotly>=5.18",
    "streamlit>=1.28",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "FinMind>=2.0.4",
    "yfinance>=0.2.38",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4",
    "pytest-mock>=3",
    "responses>=0.25",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
tw-stock-analyzer = "twstock_analyzer.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
